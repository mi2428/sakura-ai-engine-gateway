apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakura-ai-engine-searchtool
  labels:
    app.kubernetes.io/name: sakura-ai-engine-searchtool
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sakura-ai-engine-searchtool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sakura-ai-engine-searchtool
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searchtool
          image: ghcr.io/mi2428/sakura-ai-engine-gateway:must-pin
          imagePullPolicy: IfNotPresent
          command: ["/searchtool"]
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - secretRef:
                name: searchtool-credentials
          env:
            - name: SEARCHTOOL_LISTEN_ADDRESS
              value: ":8081"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
