apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakura-ai-engine-gateway
  labels:
    app.kubernetes.io/name: sakura-ai-engine-gateway
spec:
  replicas: 1
  # The in-memory account-token cooldown pool is process-local.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sakura-ai-engine-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sakura-ai-engine-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # This tag is intentionally not published: the consuming overlay must pin a digest.
          image: ghcr.io/mi2428/sakura-ai-engine-gateway:must-pin
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: sakura-ai-engine-gateway-credentials
          env:
            - name: GATEWAY_MAX_REQUEST_BYTES
              value: "67108864"
            - name: GATEWAY_MAX_CONCURRENT_REQUESTS
              value: "24"
            - name: GATEWAY_MAX_CONCURRENT_REQUESTS_PER_CLIENT
              value: "24"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 2Gi
            limits:
              memory: 6Gi
