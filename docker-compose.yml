services:
  gateway:
    image: sakura-ai-engine-gateway:dev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GATEWAY_LISTEN_ADDRESS: ":8080"
      SAKURA_AI_ENGINE_API_URL: "${SAKURA_AI_ENGINE_API_URL:-https://api.ai.sakura.ad.jp}"
      SAKURA_AI_ENGINE_ACCOUNT_TOKENS: "${SAKURA_AI_ENGINE_ACCOUNT_TOKENS:?copy .env.example to .env and configure account tokens}"
      GATEWAY_MAX_REQUEST_BYTES: "${GATEWAY_MAX_REQUEST_BYTES:-67108864}"
      GATEWAY_MEMORY_CGROUP_PATH: "${GATEWAY_MEMORY_CGROUP_PATH:-/sys/fs/cgroup}"
      GATEWAY_MAX_QUEUED_REQUESTS: "${GATEWAY_MAX_QUEUED_REQUESTS:-64}"
      GATEWAY_QUEUE_TIMEOUT: "${GATEWAY_QUEUE_TIMEOUT:-60s}"
      GOMEMLIMIT: "${GOMEMLIMIT:-4GiB}"
    ports:
      - "127.0.0.1:${GATEWAY_LOCAL_PORT:-38082}:8080"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_reservation: 2g
    mem_limit: 6g
    stop_grace_period: 40s
    restart: on-failure
